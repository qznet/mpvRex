name: Manual signed build

# Fork-only helper. The upstream workflows cannot produce an installable APK here:
#   * build.yml only runs on pull requests and emits unsigned APKs,
#   * release.yml / preview.yml need the SIGNING_KEYSTORE secret, which a fork does not inherit.
# This workflow builds the release APKs and signs them with an ephemeral keystore so the artefacts
# can be sideloaded straight onto the TV.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/manual-signed-build.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and sign release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APKs
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Sign APKs with an ephemeral keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$PWD/manual-build.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -alias mpvrex \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=mpvRex manual build,O=qznet" \
            -storepass mpvrexmanual -keypass mpvrexmanual

          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$APKSIGNER"

          RELEASE_DIR="app/build/outputs/apk/release"
          mapfile -t UNSIGNED < <(find "$RELEASE_DIR" -name 'app-*-release-unsigned.apk' -type f)
          if [ "${#UNSIGNED[@]}" -eq 0 ]; then
            echo "No unsigned release APK produced"
            ls -lah "$RELEASE_DIR" || true
            exit 1
          fi

          for apk in "${UNSIGNED[@]}"; do
            signed="${apk/-unsigned/}"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE" --ks-key-alias mpvrex \
              --ks-pass pass:mpvrexmanual --key-pass pass:mpvrexmanual \
              --out "$signed" "$apk"
            "$APKSIGNER" verify "$signed"
            rm -f "$apk"
          done

          rm -f "$KEYSTORE"
          ls -lh "$RELEASE_DIR"

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: mpvRex-signed-${{ github.sha }}
          path: app/build/outputs/apk/release/app-*-release.apk
          if-no-files-found: error
          retention-days: 30
